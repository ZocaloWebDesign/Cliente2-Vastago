<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vástago · Animación Jesús</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
#pincel,#punta,.dots,.down{display:none!important}
:root{--bordo:#AA6766;--bordo-os:#8E4F4E;--tinta:#161311}
*{box-sizing:border-box;margin:0}
html,body{background:#fff}
body{color:var(--tinta);font:400 16px/1.5 Inter,sans-serif}
.track{height:calc(100vh + 160vh);position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;background-color:#fff;
  background-image:repeating-linear-gradient(0deg, rgba(90,80,70,.028) 0 1px, transparent 1px 4px),repeating-linear-gradient(90deg, rgba(90,80,70,.028) 0 1px, transparent 1px 4px)}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:2.2vh 4.4vw;z-index:5}
.top img{height:6.4vh;min-height:44px}
.menu{font:500 15px Inter;display:flex;gap:10px;align-items:center}
.menu i{display:inline-block;width:26px;height:2px;background:var(--tinta);box-shadow:0 7px 0 var(--tinta),0 -7px 0 var(--tinta)}
.obra{position:absolute;left:50%;top:50%;width:min(72vw,112vh);aspect-ratio:1600/1067;transform:translate(-50%,-52%);z-index:2;background:#EEEFF1;
  box-shadow:0 .4vh 1vh rgba(40,30,20,.12),0 3vh 6vh rgba(40,30,20,.16),0 0 0 1px rgba(40,30,20,.07)}
.obra::after{content:"";position:absolute;left:1%;right:1%;bottom:-.8vh;height:.8vh;background:linear-gradient(#e6e3de,#cdc9c2);z-index:-1}
.obra svg{width:100%;height:100%;display:block}
.cap{position:absolute;right:0;text-align:right;top:calc(100% + 2.6vh)}
.cap .n{font:600 12px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--bordo-os)}
.cap .t{font:400 clamp(20px,2.2vw,30px)/1.15 'Patrick Hand',cursive;margin-top:.8vh}
.rail{position:absolute;left:1.5vw;top:22vh;height:56vh;width:2px;background:rgba(22,19,17,.18);z-index:6}
.rail b{position:absolute;left:-3px;top:0;width:8px;height:0;background:var(--bordo-os)}
.rail u{position:absolute;left:-5px;width:12px;height:2px;background:rgba(22,19,17,.45)}
.rail em{position:absolute;left:16px;font:500 11px Inter;font-style:normal;letter-spacing:.08em;color:#5a4f46;transform:translateY(-50%);white-space:nowrap}
.dots{position:absolute;left:4.4vw;bottom:5vh;display:flex;gap:10px;align-items:center;z-index:5}
.dots s{width:40px;height:3px;background:rgba(22,19,17,.2);display:block;text-decoration:none}
.dots s.on{background:var(--bordo-os)}
.dots small{font:500 11px Inter;letter-spacing:.12em;margin-left:10px;color:#5a4f46}
.down{position:absolute;left:0;right:0;bottom:1.6vh;text-align:center;font:500 12px Inter;letter-spacing:.14em;text-transform:uppercase;color:#5a4f46;z-index:4}
.down i{display:block;margin:4px auto 0;width:1.5px;height:18px;background:var(--bordo-os)}
.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(22,19,17,.92);color:#E1D3C0;border-radius:40px;padding:8px 10px 8px 18px;display:flex;gap:14px;align-items:center;font:500 13px Inter;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.hud b{font-weight:600;color:#D5BF9E;letter-spacing:.1em;font-size:11px;text-transform:uppercase}
.hud .fase{min-width:330px}
.hud button{white-space:nowrap;font:600 12px Inter;border:0;border-radius:30px;padding:8px 14px;cursor:pointer;background:#AA6766;color:#fff}
.hud button.g{background:rgba(255,255,255,.14)}
@media (max-width:900px){.obra{width:92vw}.rail{display:none}.hud .fase{min-width:0;font-size:12px}}
</style>
<style>.hud,.top .menu,#pincel,#punta,.dots,.down{display:none!important}html,body{overflow:hidden}.obra canvas{width:100%;height:100%;display:block}</style></head>
<body>
<div class="hud"><b>Demo</b><span class="fase" id="fase">Scroll 0 %</span><button id="play">▶ Ver sola</button><button class="g" id="reset">↺ Inicio</button></div>
<div class="track" id="track">
<section class="stage" id="stage">
  <div class="top"><img src="../logos/logo-negro.svg" alt="Vástago · Fe en obra"><div class="menu">Menú <i></i></div></div>
  <div class="obra" id="obra">
    <canvas id="seq" aria-label="animación"></canvas>
    <div class="cap"><div class="n">02 / 04 · Obra</div><div class="t">Jesús</div></div>
  </div>
  <div class="rail" id="rail"><b id="railfill"></b></div>
  <div class="dots"><s></s><s class="on"></s><s></s><s></s><small>2 / 4 · avanza al hacer scroll</small></div>
  <div class="down" id="down">Seguí bajando<i></i></div>
</section>
</div>
<script>
/* versión para celular: en lugar de dibujar los filtros SVG en cada cuadro, se recorre una secuencia de imágenes con el scroll */
(function(){
 const N=32,NAME='jesus';
 const cv=document.getElementById('seq'),cx=cv.getContext('2d');
 let p=0,on=true,imgs=new Array(N),raf=0;
 function load(i){if(i<0||i>=N)return null;if(!imgs[i]){const im=new Image();im.decoding='async';im.onload=()=>{const ok=()=>{im.ok=1;sched()};im.decode?im.decode().then(ok,ok):ok()};im.src='seq-'+NAME+'-'+String(i).padStart(2,'0')+'.webp';imgs[i]=im}return imgs[i]}
 function draw(){raf=0;if(!on)return;
  const f=Math.max(0,Math.min(1,p))*(N-1),i=Math.min(N-1,Math.floor(f)),a=f-i;for(let k=-1;k<=7;k++)load(i+k);
  let base=imgs[i]&&imgs[i].ok?imgs[i]:null;
  for(let k=1;k<N&&!base;k++){const c=imgs[i-k],d=imgs[i+k];base=c&&c.ok?c:(d&&d.ok?d:null)}
  if(!base)return;if(cv.width!==base.naturalWidth||cv.height!==base.naturalHeight){cv.width=base.naturalWidth;cv.height=base.naturalHeight}
  cx.globalAlpha=1;cx.drawImage(base,0,0)
  const nx=imgs[i+1];if(a>.02&&nx&&nx.ok){cx.globalAlpha=a;cx.drawImage(nx,0,0);cx.globalAlpha=1}}
 const sched=()=>{if(!raf)raf=requestAnimationFrame(draw)};
 addEventListener('message',e=>{const d=e.data||{};if(typeof d.p==='number'){p=d.p;sched()}if(typeof d.on==='boolean'){on=d.on;if(on)sched()}});
 for(let k=0;k<=8;k++)load(k);
 load(0);load(1);sched();
})();
</script>
</body>
</html>
