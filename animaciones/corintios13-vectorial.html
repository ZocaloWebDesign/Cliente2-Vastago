<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vástago · Animación 1 Corintios 13</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bordo:#AA6766;--bordo-os:#8E4F4E;--tinta:#161311}
*{box-sizing:border-box;margin:0}
html,body{background:#fff}
body{color:var(--tinta);font:400 16px/1.5 Inter,sans-serif}
.track{height:calc(100vh + 160vh);position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;background-color:#fff;
  background-image:
    repeating-linear-gradient(0deg, rgba(90,80,70,.028) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(90,80,70,.028) 0 1px, transparent 1px 4px)}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:2.2vh 4.4vw;z-index:5}
.top img{height:6.4vh;min-height:44px}
.menu{font:500 15px Inter;display:flex;gap:10px;align-items:center}
.menu i{display:inline-block;width:26px;height:2px;background:var(--tinta);box-shadow:0 7px 0 var(--tinta),0 -7px 0 var(--tinta)}

/* cuadro al centro */
.obra{position:absolute;left:50%;top:51%;height:82vh;aspect-ratio:836/1000;transform:translate(-50%,-50%);z-index:2;background:#fff;
  box-shadow:0 .4vh 1vh rgba(40,30,20,.12),0 3vh 6vh rgba(40,30,20,.16),0 0 0 1px rgba(40,30,20,.07)}
.obra svg{width:100%;height:100%;display:block}

/* rótulo lateral */
.cap{position:absolute;left:8vw;top:51%;transform:translateY(-50%);z-index:3;max-width:18vw}
.cap .n{font:600 12px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--bordo-os)}
.cap .t{font:400 clamp(20px,2.2vw,32px)/1.15 'Patrick Hand',cursive;margin-top:1.2vh;letter-spacing:.02em}

/* progreso */
.rail{position:absolute;left:1.5vw;top:22vh;height:56vh;width:2px;background:rgba(22,19,17,.18);z-index:6}
.rail b{position:absolute;left:-3px;top:0;width:8px;height:0;background:var(--bordo-os)}
.rail u{position:absolute;left:-5px;width:12px;height:2px;background:rgba(22,19,17,.45)}
.rail em{position:absolute;left:16px;font:500 11px Inter;font-style:normal;letter-spacing:.08em;color:#5a4f46;transform:translateY(-50%);white-space:nowrap}
.dots{position:absolute;left:8vw;bottom:5vh;display:flex;gap:10px;align-items:center;z-index:5}
.dots s{width:40px;height:3px;background:rgba(22,19,17,.2);display:block;text-decoration:none}
.dots s.on{background:var(--bordo-os)}
.dots small{font:500 11px Inter;letter-spacing:.12em;margin-left:10px;color:#5a4f46}
.down{position:absolute;left:0;right:0;bottom:1.6vh;text-align:center;font:500 12px Inter;letter-spacing:.14em;text-transform:uppercase;color:#5a4f46;z-index:4}
.down i{display:block;margin:4px auto 0;width:1.5px;height:18px;background:var(--bordo-os)}

/* panel de demo */
.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(22,19,17,.92);color:#E1D3C0;border-radius:40px;padding:8px 10px 8px 18px;display:flex;gap:14px;align-items:center;font:500 13px Inter;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.hud b{font-weight:600;color:#D5BF9E;letter-spacing:.1em;font-size:11px;text-transform:uppercase}
.hud .fase{min-width:300px}
.hud button{white-space:nowrap;font:600 12px Inter;border:0;border-radius:30px;padding:8px 14px;cursor:pointer;background:#AA6766;color:#fff}
.hud button.g{background:rgba(255,255,255,.14)}
@media (max-width:1100px){.cap{display:none}}
@media (max-width:900px){.obra{height:70vh}.rail{display:none}.hud .fase{min-width:0;font-size:12px}}
</style>
</head>
<body>

        <linearGradient id="gSh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".4" stop-color="#C4C4C9"/><stop offset="1" stop-color="#5C5C63"/></linearGradient>
        <radialGradient id="gHe" cx="38%" cy="42%" r="75%"><stop offset="0" stop-color="#D01F45"/><stop offset=".55" stop-color="#A5163A"/><stop offset="1" stop-color="#6B0F27"/></radialGradient>
        <mask id="mFondo" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1040" height="1200"><g id="trazos" fill="none" stroke="#fff" stroke-width="210" stroke-linecap="round" filter="url(#rugoso)"></g></mask>
        <mask id="mTexto" maskUnits="userSpaceOnUse" x="0" y="0" width="836" height="1000">

          <path d="M432 332 C428 312 436 298 452 296 C474 296 490 312 496 336 C502 322 518 312 538 318 C548 305 566 300 582 306 C596 312 604 332 610 348 C650 358 690 366 722 382 C745 392 760 405 757 425 L768 440 C772 470 770 490 765 505 C775 560 780 620 772 680 C765 740 745 800 715 840 C690 865 650 885 610 885 C560 888 500 870 460 840 C420 810 370 760 352 700 C338 650 340 600 342 560 C345 510 360 460 385 420 C400 390 420 360 432 332Z" transform="translate(201 247) scale(.3919)" fill="#000" stroke="#000" stroke-width="95" stroke-linejoin="round"/>
        </mask>
        <mask id="mCorazon" maskUnits="userSpaceOnUse" x="0" y="0" width="1100" height="1100"><g id="trCor" fill="none" stroke="#fff" stroke-width="150" stroke-linecap="round" filter="url(#rugoso)"></g></mask>
        <clipPath id="cObra"><rect width="836" height="1000"/></clipPath>
      </defs>

      <g clip-path="url(#cObra)">
        <!-- 1. fondo pintado con pincel -->
        <g mask="url(#mFondo)">
          <rect width="836" height="1000" fill="#CDAD9E"/>
          <rect width="836" height="1000" filter="url(#manchas)"/>
          <rect width="836" height="1000" filter="url(#grano)"/>

        <!-- 3. corazón (contorno → relleno → reflejos) -->
        <g transform="translate(201 247) scale(.3919)">
          <g id="corazon">
            <g id="cLatido" filter="url(#pintado)">
              <path id="hSil" d="M432 332 C428 312 436 298 452 296 C474 296 490 312 496 336 C502 322 518 312 538 318 C548 305 566 300 582 306 C596 312 604 332 610 348 C650 358 690 366 722 382 C745 392 760 405 757 425 L768 440 C772 470 770 490 765 505 C775 560 780 620 772 680 C765 740 745 800 715 840 C690 865 650 885 610 885 C560 888 500 870 460 840 C420 810 370 760 352 700 C338 650 340 600 342 560 C345 510 360 460 385 420 C400 390 420 360 432 332Z" fill="none" stroke="#120508" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
              <g mask="url(#mCorazon)">
                <path d="M432 332 C428 312 436 298 452 296 C474 296 490 312 496 336 C502 322 518 312 538 318 C548 305 566 300 582 306 C596 312 604 332 610 348 C650 358 690 366 722 382 C745 392 760 405 757 425 L768 440 C772 470 770 490 765 505 C775 560 780 620 772 680 C765 740 745 800 715 840 C690 865 650 885 610 885 C560 888 500 870 460 840 C420 810 370 760 352 700 C338 650 340 600 342 560 C345 510 360 460 385 420 C400 390 420 360 432 332Z" fill="url(#gHe)"/>
                <path d="M470 330 C430 380 410 470 420 560 C440 600 470 580 480 520 C490 450 520 400 560 380 C520 360 490 345 470 330Z" fill="#7A1128" opacity=".45"/>
                <path d="M520 430 C580 400 660 395 725 420 C740 470 735 520 700 545 C640 520 560 500 520 430Z" fill="#C41C42" opacity=".8"/>
                <path d="M600 440 C640 420 700 430 725 480 C720 530 660 550 620 530 C595 505 590 470 600 440Z" fill="#C41C42" stroke="#4B0A19" stroke-width="5"/>
                <path d="M380 640 C420 610 470 640 480 700 C470 770 430 800 390 780 C360 740 360 680 380 640Z" fill="#8E1431" opacity=".5"/>
                <path d="M610 620 C660 600 735 630 750 700 C740 770 700 820 660 840 C620 800 595 700 610 620Z" fill="#8E1431" opacity=".4"/>
                <ellipse cx="464" cy="308" rx="26" ry="13" fill="#3A0813" stroke="#120508" stroke-width="7"/>
                <ellipse cx="560" cy="319" rx="22" ry="11" fill="#3A0813" stroke="#120508" stroke-width="7"/>
                <ellipse cx="601" cy="336" rx="15" ry="9" fill="#3A0813" stroke="#120508" stroke-width="6"/>
                <ellipse cx="735" cy="430" rx="22" ry="32" fill="#1B0609"/>
                <ellipse cx="768" cy="485" rx="14" ry="28" fill="#1B0609"/>
                <g fill="none" stroke="#3D0813" stroke-linecap="round" opacity=".85"><path d="M372 612 C420 562 480 522 560 472 C610 442 660 432 702 442" stroke-width="12"/><path d="M478 342 C445 400 432 480 442 566" stroke-width="10"/><path d="M588 372 C560 395 540 420 530 452" stroke-width="8"/></g>
                <g fill="none" stroke="#FF2F7A" stroke-linecap="round">
                  <path d="M432 405 C405 450 385 500 380 545" stroke-width="22" opacity=".95"/>
                  <path d="M395 470 C380 510 376 560 378 600" stroke-width="12" opacity=".7"/>
                  <path d="M470 545 C500 515 520 495 545 482" stroke-width="18" opacity=".9"/>
                  <path d="M520 425 C550 400 600 380 640 375" stroke-width="12" opacity=".6"/>
                  <path d="M668 372 C690 375 710 380 722 388" stroke-width="22" opacity=".95"/>
                  <path d="M640 490 C655 480 672 482 680 490" stroke-width="20" opacity=".9"/>
                  <path d="M740 650 C746 690 744 730 736 770" stroke-width="22" opacity=".95"/>
                  <path d="M700 800 C690 830 670 855 650 868" stroke-width="12" opacity=".6"/>
                  <path d="M372 690 C378 715 392 740 410 760" stroke-width="18" opacity=".9"/>
                  <path d="M460 810 C480 828 500 838 520 844" stroke-width="10" opacity=".6"/>
                </g>
                <g fill="none" stroke="#14060A" stroke-width="5" stroke-linecap="round" opacity=".85">
                  <path d="M520 590 C545 630 560 690 548 760"/><path d="M548 760 C535 790 520 810 505 830"/>
                  <path d="M640 600 C665 630 660 690 630 720"/><path d="M630 720 C615 740 625 780 650 805"/>
                  <path d="M470 640 C500 650 520 670 530 700"/><path d="M575 690 C600 700 620 715 640 720"/>
                  <path d="M440 560 C470 590 500 600 520 590"/><path d="M700 610 C720 640 722 670 710 700"/>

                </g>

              </g>

          </g>
        </g>
        <!-- 4. esquirlas -->
        <g transform="translate(201 247) scale(.3919)"><g id="esquirlas"></g></g>
        <!-- pincel (se ve mientras pinta) -->
        <g id="pincel" opacity="0"><g transform="rotate(-38)">
          <path d="M0 0 C14 -16 44 -18 66 -13 L66 13 C44 18 14 16 0 0Z" fill="#D9BFB1" stroke="#7a5a4c" stroke-width="2"/>
          <rect x="66" y="-14" width="48" height="28" rx="3" fill="#B7B7BC" stroke="#6c6c72" stroke-width="2"/>

  <div class="rail" id="rail"><b id="railfill"></b></div>
  <div class="dots"><s class="on"></s><s></s><s></s><s></s><small>1 / 4 · avanza al hacer scroll</small></div>

<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const eOut=t=>1-Math.pow(1-t,3);
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const params=new URLSearchParams(location.search);
const fixedP=params.has('p')?parseFloat(params.get('p')):null;
const rnd=s=>{let x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};

/* 1. trazos de pincel del fondo */
const TR=[];const gT=$('trazos');
for(let k=0;k<8;k++){
  const dir=k%2==0?1:-1,y=k*140-30,tilt=(k%2==0?26:-22);
  const x0=dir>0?-90:930,x1=dir>0?930:-90;
  const p=el('path',{d:`M${x0} ${y} Q 418 ${y+tilt*2.2} ${x1} ${y+tilt}`},gT);
  const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;TR.push({p,L});
}

/* 2. texto: líneas justificadas como en la obra  [texto, x1, x2, palabras subrayadas] */
const LINEAS=[
 [['EL AMOR ES PACIENTE, ES',34,800,[3]]],
 [['BONDADOSO. EL AMOR NO ES',34,800,[0]]],
 [['ENVIDIOSO, NI PRESUMIDO NI',34,800,[3]]],
 [['ORGULLOSO, NO SE COMPORTA',34,800,[0]]],
 [['CON RUDEZA, NO ES EGOISTA,',34,800,[1,4]]],
 [['NO SE ENOJA FÁCILMENTE, NO',34,800,[3]]],
 [['GUARDA RENCOR EL AMOR NO',34,800,[4]]],
 [['SE DELEITA EN LA MALDAD, SINO',34,800,[4]]],
 [['QUE SE REGOCIJA',34,330,[2]],['CON LA VERDAD.',515,800,[]]],
 [['TODO LO',34,195,[]],['DISCULPA,',525,805,[0]]],
 [['TODO LO CREE,',34,325,[2]],['TODO LO',525,690,[]]],
 [['ESPERA TODO',34,285,[]],['LO SOPORTA.',515,805,[]]],
 [['EL AMOR JAMÁS',34,345,[1]],['SE EXTINGUE.',505,805,[]]],
 [['LAS PROFECÍAS CESARÁN, LAS',34,800,[]]],
 [['LENGUAS TERMINARÁN, Y EL',34,800,[1]]],
 [['CONOCIMIENTO SE AGOTARÁ.',34,800,[0]]],
 [['AHORA PUES, PERMANECEN LA',34,800,[2]]],
 [['FE, LA ESPERANZA, Y EL AMOR.',34,800,[3,6]]],
 [['PERO EL MÁS IMPORTANTE',34,800,[3]]],
 [['ES',34,100,[]],['EL',285,345,[]],['AMOR!',450,800,[1]]]
];
const Y0=62,DY=44.9,LN=[],gTxt=$('texto');
function construirTexto(){
  LINEAS.forEach((segs,i)=>{
    const y=Y0+i*DY+(i>=19?4:0);
    const cp=el('clipPath',{id:'cl'+i},document.querySelector('defs'));
    const r=el('rect',{x:0,y:y-44,width:0,height:62},cp);
    const g=el('g',{'clip-path':`url(#cl${i})`},gTxt);
    segs.forEach(([t,x1,x2,subr])=>{
      const tx=el('text',{x:x1,y:y+14,'font-family':"'Patrick Hand',cursive",'font-size':48,fill:'#FDF9F3',stroke:'#FDF9F3','stroke-width':1.7,'paint-order':'stroke'},g);
      tx.textContent=t;
      const nat=tx.getComputedTextLength(),W=x2-x1;
      if(nat>W*.96)tx.setAttribute('font-size',48*W*.96/nat);
      tx.setAttribute('textLength',W);tx.setAttribute('lengthAdjust','spacing');
      if(subr.length){
        const pal=t.split(' ');let idx=0;const st=[];pal.forEach(w=>{st.push([idx,idx+w.length-1]);idx+=w.length+1});
        subr.forEach(wi=>{
          const [a,b]=st[wi]||[0,0];
          try{
            const xa=tx.getStartPositionOfChar(a).x,xb=tx.getEndPositionOfChar(b).x;
            let d=`M${xa} ${y+22}`;const n=Math.max(3,Math.round((xb-xa)/16));
            for(let k=1;k<=n;k++)d+=` L${lerp(xa,xb,k/n)} ${y+22+(rnd(i*31+wi*7+k)-.5)*7}`;
            el('path',{d,fill:'none',stroke:'#B2AB45','stroke-width':3.2,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.9},g);
          }catch(e){}
        });
      }
    });
    LN.push({r,y,x2:Math.max(...segs.map(s=>s[2]))+20});
  });
}

/* 3. corazón: trazos que rellenan */
const TC=[];const gC=$('trCor');
for(let k=0;k<7;k++){
  const dir=k%2==0?1:-1,y=250+k*115;
  const p=el('path',{d:dir>0?`M280 ${y} L860 ${y+40}`:`M860 ${y} L280 ${y+40}`},gC);
  const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;TC.push({p,L});
}

/* 4. esquirlas (coordenadas del espacio del corazón) */
const ESQ=[
 [300,225,120,130,-15],[725,190,110,120,10],[545,255,95,62,0],[95,295,90,90,20],[60,540,100,110,10],[275,455,95,80,-25],
 [270,800,130,180,15],[565,935,230,120,0],[935,905,130,160,-10],[895,515,100,70,0],[830,330,130,80,-25],[45,730,90,110,15],
 [1060,455,90,110,0],[1000,690,60,110,10],[855,725,70,50,0],[540,125,130,50,-10],
 [80,200,36,50,0],[230,275,36,52,0],[425,240,46,56,0],[820,165,48,38,0],[945,270,40,30,0],[505,170,28,38,0],[210,460,28,22,0],[1010,300,34,30,0],[640,215,30,34,0],[130,880,40,34,0]
];
const gE=$('esquirlas'),ES=[];
ESQ.forEach(([cx,cy,w,h,rot],i)=>{
  const g=el('g',{},gE),s=i+1,n=6,pts=[];w*=1.3;h*=1.3;
  for(let k=0;k<n;k++){const a=(k/n)*Math.PI*2+rnd(s*3+k)*1-.5,rr=.58+rnd(s*5+k)*.42;pts.push([Math.cos(a)*w/2*rr,Math.sin(a)*h/2*rr])}
  el('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:'url(#gSh)',stroke:'#202024','stroke-width':Math.max(2,w/30),'stroke-linejoin':'round'},g);
  el('polygon',{points:[pts[1],pts[2],pts[3],[pts[3][0]*.45,pts[3][1]*.45],[pts[1][0]*.45,pts[1][1]*.45]].map(p=>p.join(',')).join(' '),fill:'#17171A',opacity:.9},g);
  for(let k=0;k<3;k++){const x=(rnd(s*9+k)-.5)*w*.5,y=(rnd(s*13+k)-.5)*h*.5;el('path',{d:`M${x} ${y} l${w*.22} ${-h*.06}`,stroke:'#fff','stroke-width':Math.max(2,w/20),'stroke-linecap':'round',opacity:.75,fill:'none'},g)}
  ES.push({g,cx,cy,rot,i,w});
});

/* render */
const FASES=[[0,'Scroll {p} % · el pincel pinta el fondo'],[.12,'Scroll {p} % · el versículo se escribe línea por línea'],[.60,'Scroll {p} % · se pinta el corazón (contorno, relleno, reflejos)'],[.80,'Scroll {p} % · las esquirlas salen y se acomodan'],[.93,'Scroll {p} % · la obra queda quieta y el corazón late']];
const HC=[555,600];
function render(p,time){
  let activo=null;
  TR.forEach((o,k)=>{const a=k*.0185,q=eInOut(seg(p,a,a+.07));o.p.style.strokeDashoffset=o.L*(1-q);if(q>.01&&q<.99)activo={o,q,k}});
  const pin=$('pincel'),punta=$('punta');
  if(activo){const pt=activo.o.p.getPointAtLength(activo.o.L*activo.q);pin.setAttribute('transform',`translate(${pt.x} ${pt.y}) scale(${activo.k%2?-1:1} 1)`);pin.setAttribute('opacity',1)}else pin.setAttribute('opacity',0);
  let la=null;
  LN.forEach((l,i)=>{const a=.11+i*.0245,q=eOut(seg(p,a,a+.05));l.r.setAttribute('width',l.x2*q);if(q>.01&&q<.99)la={l,q}});
  if(la&&!activo){punta.setAttribute('cx',la.l.x2*la.q);punta.setAttribute('cy',la.l.y+2);punta.setAttribute('opacity',.9)}else punta.setAttribute('opacity',0);
  $('firma').setAttribute('opacity',seg(p,.59,.64));
  const hs=$('hSil'),L=hs.getTotalLength();hs.style.strokeDasharray=L;hs.style.strokeDashoffset=L*(1-eInOut(seg(p,.62,.69)));
  TC.forEach((o,k)=>{const a=.665+k*.0065,q=eInOut(seg(p,a,a+.04));o.p.style.strokeDashoffset=o.L*(1-q)});
  const beat=Math.max(0,Math.sin(time*2.3))**7,done=seg(p,.92,.97),sc=1+.028*beat*done;
  $('cLatido').setAttribute('transform',`translate(${HC[0]} ${HC[1]}) scale(${sc}) translate(${-HC[0]} ${-HC[1]})`);
  ES.forEach(o=>{
    const a=.78+o.i*.0045,q=eOut(seg(p,a,a+.11)),fl=seg(p,.9,1);
    const x=lerp(HC[0],o.cx,q)+Math.sin(time*.7+o.i)*3*done,y=lerp(HC[1],o.cy,q)+Math.sin(time*1.1+o.i*1.7)*3.5*done+fl*5;
    const rot=o.rot*q+(1-q)*(o.i%2?240:-200),s=.2+.8*q;
    o.g.setAttribute('transform',`translate(${x} ${y}) rotate(${rot}) scale(${s})`);o.g.setAttribute('opacity',clamp(q*5));
  });
  $('railfill').style.height=(p*.25*100)+'%';
  let f=FASES[0][1];FASES.forEach(([a,t])=>{if(p>=a)f=t});$('fase').textContent=f.replace('{p}',Math.round(p*100));
  $('down').style.opacity=1-seg(p,.93,1)*.8;
}
[0,25,50,75,100].forEach(v=>{const u=document.createElement('u');u.style.top=v+'%';const e=document.createElement('em');e.style.top=v+'%';e.textContent=v+'%';$('rail').append(u,e)});

let target=0,shown=0,t0=performance.now();
const progresoScroll=()=>clamp(scrollY/($('track').offsetHeight-innerHeight));
function loop(now){
  const time=(now-t0)/1000;
  target=fixedP!==null?fixedP:(reduce?1:progresoScroll());
  shown+=(target-shown)*(fixedP!==null||reduce?1:.14);
  if(Math.abs(target-shown)<.0004)shown=target;
  render(shown,fixedP!==null?(params.get('t')?parseFloat(params.get('t')):.4):time);
  requestAnimationFrame(loop);
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{construirTexto();requestAnimationFrame(loop)});

/* controles de la demo */
let anim=null;
const maxScroll=()=>$('track').offsetHeight-innerHeight;
function parar(){if(anim){cancelAnimationFrame(anim);anim=null;$('play').textContent='▶ Ver sola'}}
$('play').onclick=()=>{
  if(anim){parar();return}
  if(scrollY>=maxScroll()-4)scrollTo(0,0);
  const from=scrollY,to=maxScroll(),dur=22000,s=performance.now();
  $('play').textContent='❚❚ Pausar';
  const step=n=>{const t=clamp((n-s)/dur);scrollTo(0,lerp(from,to,t));if(t<1)anim=requestAnimationFrame(step);else parar()};
  anim=requestAnimationFrame(step);
};
$('reset').onclick=()=>{parar();scrollTo({top:0,behavior:'smooth'})};
addEventListener('wheel',parar,{passive:true});addEventListener('touchstart',parar,{passive:true});
</script>
